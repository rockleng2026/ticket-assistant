name: 王力宏「最好的地方II」世界巡回演唱会-深圳站(大麦)
platform: damai
app:
  package: cn.damai
  main_activity: .homepage.MainActivity
  search_entry_hint: 搜索
  deep_link: null
concert:
  name: 王力宏「最好的地方II」世界巡回演唱会-深圳站(大麦)
  search_keyword: 王力宏
  session: null
  tier: null
  tier_priority:
  - ¥380
  - ¥580
  quantity: 2
  max_price: null
  attendees: 2
  result_match: 演唱会-深圳站
sale:
  at: '2026-11-27 13:33:00'
  lead_seconds: 0.5
  burst_seconds: 8.0
  tap_interval_ms: 120
  timezone: UTC+08:00
  wait_timeout: 900.0
  preflight_seconds: 300.0
device:
  serial: null
  connect: null
  auto_prepare: true
  orientation: portrait
selectors:
  search_entry:
    candidates:
    - text: 搜索
    - textContains: 记录音乐现场
    - descContains: 搜索
  result_show:
    candidates:
    - textContains: 演唱会-深圳站
    - textContains: 王力宏
  detail_ready:
    candidates:
    - text: 去设置
    - text: 添加到日历
    - textContains: 预售
    - textContains: 抢票加速
    - textContains: 实名制
  buy_button:
    candidates:
    - text: 立即购买
    - text: 立即抢购
    - textNorm: 已预约
    - bottomWideButton: true
    - coord:
      - 0.6313
      - 0.9399
    aliases:
    - 立即购买
    - 立即抢购
    - 去预约
    - 已预约
  session_marker:
    candidates:
    - textContains: 1月16日场次
  sku_panel:
    candidates:
    - text: 选择票档
    - text: 请选择票档
    - textContains: 每笔订单限购
    - textContains: 场次时间均为演出当地时间
    - textContains: 预约想看票档
  sku_confirm_text:
    candidates:
    - text: 确定
    - text: 立即购买
    - text: 立即下单
    - text: 提交订单
  ticket_ready:
    candidates:
    - text: 票档
    - text: 场次
    - textContains: 每笔订单限购
    - textContains: 确认购买
  order_ready:
    candidates:
    - text: 确认购买
    - text: 立即提交
    - text: 实名观演人
    - textContains: 支付方式
    - textContains: 配送方式
  sku_confirm:
    candidates:
    - text: 确定
    - bottomRightButton: true
    - coord:
      - 0.779
      - 0.9421
  submit_button:
    candidates:
    - text: 立即提交
    - text: 提交订单
    - textContains: 提交
  tier:
    candidates:
    - text: ¥380
    - text: '380'
    - coord:
      - 0.1946
      - 0.441
  qty_plus:
    candidates:
    - qtyPlus: true
    - descContains: 增加
    - text: +
    - coord:
      - 0.8861
      - 0.8644
  confirm_button:
    candidates:
    - text: 确定
    - text: 提交订单
  pay_button:
    candidates:
    - text: 立即提交
    - text: 提交订单
    - text: 立即支付
  reservation_entry:
    candidates:
    - text: 去设置
  reservation_info:
    candidates:
    - textContains: 票张数
    - textContains: 票档
  logged_out_marker:
    candidates:
    - textContains: 登录
    - textContains: 我的-未登录
steps:
- action: wake
  phase: pre
- action: launch
  phase: pre
  settle: 6.0
- action: wait
  phase: pre
  target: search_entry
  timeout: 20
- action: tap
  phase: pre
  target: search_entry
  settle: 2.5
- action: search_submit
  phase: pre
  text: 王力宏
  box_hint: 话剧音乐剧都在这哦
  fallback_hint: 搜索
  settle: 5.0
- action: wait
  phase: pre
  target: result_show
  timeout: 20
- action: tap
  phase: pre
  target: result_show
  settle: 8.0
- action: dismiss
  phase: pre
  rules:
  - text: 确认并知晓
    timeout: 8
    settle: 2.0
    optional: true
  - text: 我知道了
    timeout: 5
    settle: 1.5
    optional: true
- action: wait
  phase: pre
  target: detail_ready
  timeout: 20
- action: wait
  phase: pre
  target: session_marker
  timeout: 20
- action: require
  phase: pre
  target: session_marker
  expect: present
  message: 当前场次不是任务指定的场次，请在 App 里切到正确的场次
- action: check_reservation
  phase: pre
  tier: ¥380
  quantity: 2
  optional: true
- action: tap
  phase: pre
  target: buy_button
  settle: 4.0
  optional: true
- action: wait
  phase: pre
  target: sku_panel
  timeout: 20
- action: scroll_top
  phase: pre
  times: 6
  settle: 0.3
- action: require
  phase: pre
  target: logged_out_marker
  expect: absent
  message: 大麦未登录，请先在 App 内登录
- action: dump
  phase: pre
  prefix: armed
- action: burst
  phase: fire
  target: sku_confirm_text
  until: order_ready
  mode: auto
  window: 10.0
  interval_ms: 120
  check_every_ms: 150
  refresh_every: 6
  blockers:
  - 我已阅读并同意
  - 知道了
  - 继续尝试
- action: select_attendees
  phase: post
  entry: 实名观演人
  confirm: 确认选择
  optional: true
- action: tap
  phase: post
  target: submit_button
  verify_price: ¥380
  settle: 1.5
  requires_submit: true
  blockers:
  - 继续尝试
  retry: 5
  backoff: 2.0
  optional: true
- action: stop
  phase: post
  message: 已生成订单，请手动完成支付
stop_before_payment: true
submit_order: false
auto_pay: false
