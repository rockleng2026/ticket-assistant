name: 石凯「时空乐园」2026巡回演唱会-深圳站(大麦)
platform: damai
app:
  package: cn.damai
  main_activity: .homepage.MainActivity
  search_entry_hint: 搜索
  deep_link: null
concert:
  name: 石凯「时空乐园」2026巡回演唱会-深圳站(大麦)
  search_keyword: 石凯
  session: null
  tier: null
  tier_priority:
  - ¥680
  quantity: 2
  max_price: null
  attendees: 2
  result_match: 时空乐园
sale:
  at: '2026-11-26 23:22:00'
  lead_seconds: 0.5
  burst_seconds: 8.0
  tap_interval_ms: 120
  timezone: UTC+08:00
  wait_timeout: 900.0
  preflight_seconds: 300.0
device:
  serial: null
  connect: null
  auto_prepare: true
  orientation: portrait
selectors:
  search_entry:
    candidates:
    - text: 搜索
    - textContains: 记录音乐现场
    - descContains: 搜索
  result_show:
    candidates:
    - textContains: 时空乐园
    - textContains: 石凯
  detail_ready:
    candidates:
    - text: 去设置
    - text: 添加到日历
    - textContains: 预售
    - textContains: 抢票加速
    - textContains: 实名制
  buy_button:
    candidates:
    - text: 立即购买
    - text: 立即抢购
    - textNorm: 已预约
    - bottomWideButton: true
    - coord:
      - 0.6313
      - 0.9399
    aliases:
    - 立即购买
    - 立即抢购
    - 去预约
    - 已预约
  ticket_ready:
    candidates:
    - text: 票档
    - text: 场次
    - textContains: 每笔订单限购
    - textContains: 确认购买
  order_ready:
    candidates:
    - text: 确认购买
    - text: 立即提交
    - text: 实名观演人
    - textContains: 支付方式
    - textContains: 配送方式
  sku_confirm:
    candidates:
    - text: 确定
    - bottomRightButton: true
    - coord:
      - 0.779
      - 0.9421
  submit_button:
    candidates:
    - text: 立即提交
    - text: 提交订单
    - textContains: 提交
  tier:
    candidates:
    - text: ¥380
    - text: '380'
    - coord:
      - 0.1946
      - 0.441
  qty_plus:
    candidates:
    - qtyPlus: true
    - descContains: 增加
    - text: +
    - coord:
      - 0.8861
      - 0.8644
  confirm_button:
    candidates:
    - text: 确定
    - text: 提交订单
  pay_button:
    candidates:
    - text: 立即提交
    - text: 提交订单
    - text: 立即支付
  reservation_entry:
    candidates:
    - text: 去设置
  reservation_info:
    candidates:
    - textContains: 票张数
    - textContains: 票档
  logged_out_marker:
    candidates:
    - textContains: 登录
    - textContains: 我的-未登录
steps:
- action: wake
  phase: pre
- action: launch
  phase: pre
  settle: 6.0
- action: wait
  phase: pre
  target: search_entry
  timeout: 20
- action: tap
  phase: pre
  target: search_entry
  settle: 2.5
- action: search_submit
  phase: pre
  text: 石凯
  box_hint: 话剧音乐剧都在这哦
  fallback_hint: 搜索
  settle: 5.0
- action: wait
  phase: pre
  target: result_show
  timeout: 20
- action: tap
  phase: pre
  target: result_show
  settle: 8.0
- action: wait
  phase: pre
  target: detail_ready
  timeout: 20
- action: check_reservation
  phase: pre
  tier: ¥680
  quantity: 2
  optional: true
- action: wait
  phase: pre
  target: detail_ready
  timeout: 15
- action: scroll_top
  phase: pre
  times: 10
  settle: 0.3
- action: wait
  phase: pre
  target: buy_button
  timeout: 25
- action: require
  phase: pre
  target: logged_out_marker
  expect: absent
  message: 大麦未登录，请先在 App 内登录
- action: dump
  phase: pre
  prefix: armed
- action: burst
  phase: fire
  target: buy_button
  until: ticket_ready
  mode: auto
  window: 8.0
  interval_ms: 120
  check_every_ms: 150
- action: loop
  phase: post
  until: order_ready
  max_rounds: 2
  budget: 10
  steps:
  - action: select_tier
    priority:
    - ¥680
    wait: 0.8
    settle: 0.3
    coords:
    - - 0.1946
      - 0.441
    - - 0.4943
      - 0.441
    - - 0.1946
      - 0.5112
    - - 0.4943
      - 0.5112
    grid_settle: 0.45
    optional: true
  - action: select_quantity
    plus_target: qty_plus
    current: 1
    optional: true
  - action: tap
    target: sku_confirm
    until: order_ready
    until_timeout: 3.0
    retry: 1
    settle: 0.1
    optional: true
- action: select_attendees
  phase: post
  entry: 实名观演人
  confirm: 确认选择
  optional: true
- action: tap
  phase: post
  target: submit_button
  verify_price: ¥680
  settle: 2.0
  requires_submit: true
  optional: true
- action: stop
  phase: post
  message: 已生成订单，请手动完成支付
stop_before_payment: true
submit_order: false
auto_pay: false
