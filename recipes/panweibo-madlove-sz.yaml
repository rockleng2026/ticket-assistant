name: 潘玮柏MADLOVE:ULTRA巡回演唱会-深圳站(美团)
platform: meituan
app:
  package: com.sankuai.meituan
  main_activity: com.meituan.android.pt.homepage.activity.MainActivity
  search_entry_hint: 搜索
  deep_link: null
concert:
  name: 潘玮柏MADLOVE:ULTRA巡回演唱会-深圳站(美团)
  search_keyword: 潘玮柏
  session: null
  tier: null
  tier_priority:
  - ¥380
  - ¥480
  quantity: 2
  max_price: null
  attendees: 2
  result_match: MADLOVE
sale:
  at: '2026-11-27 13:22:00'
  lead_seconds: 0.2
  burst_seconds: 8.0
  tap_interval_ms: 180
  timezone: UTC+08:00
  wait_timeout: 900.0
  preflight_seconds: 300.0
device:
  serial: null
  connect: null
  auto_prepare: true
  orientation: portrait
selectors:
  home_show:
    candidates:
    - descContains: 电影演出
    - text: 电影演出
  tab_concert:
    candidates:
    - text: 演唱会
    - textContains: 演唱会
  search_box:
    candidates:
    - textContains: 搜索明星
    - descContains: 搜索
    - textContains: 搜索演出
  result_show:
    candidates:
    - textContains: MADLOVE
    - textContains: 潘玮柏
  city_tab:
    candidates:
    - text: 深圳站
    - text: 深圳
  buy_button:
    candidates:
    - text: 立即购票
    - text: 立即购买
    - text: 去抢票
    - textNorm: 已预约
    - textNorm: 预约
    - textContains: 购票
    - coord:
      - 0.5585
      - 0.9414
    aliases:
    - 立即购票
    - 立即购买
    - 去抢票
    - 马上抢
    - 预约
    - 即将开售
  ticket_ready:
    candidates:
    - text: 选择票档
    - text: 请选择票档
    - text: 确认
    - text: 提交订单
  session_item:
    candidates:
    - textContains: '19:'
    - textContains: '19:00'
  order_ready:
    candidates:
    - text: 实名观演人
    - text: 取票方式
    - text: 立即支付
    - textContains: 支付成功后
  payment_ready:
    candidates:
    - textContains: 支付方式
    - textContains: 月付交易
    - textContains: 交易剩余时间
    - text: 美团支付
  tier:
    candidates:
    - text: ¥680
    - text: ￥680
    - text: '680'
  qty_plus:
    candidates:
    - descContains: 增加
    - text: ＋
    - text: +
    - coord:
      - 0.9019
      - 0.8777
  confirm_button:
    candidates:
    - text: 确认
    - text: 提交订单
  pay_button:
    candidates:
    - text: 立即支付
    - text: 立即付款
  pay_confirm:
    candidates:
    - textContains: 月付交易
    - textContains: 确认支付
    - textContains: 立即支付
    - bottomButton: true
  logged_out_marker:
    candidates:
    - textContains: 去登录
    - textContains: 登录后
steps:
- action: wake
  phase: pre
- action: launch
  phase: pre
  settle: 5.0
- action: dismiss
  phase: pre
  rules:
  - back_when: 登录体验完整功能
    timeout: 3
    settle: 1.5
  - back_when: 欢迎登录美团
    timeout: 3
    settle: 1.5
  - text: 允许
    timeout: 3
    settle: 1.0
    optional: true
  - text: 同意
    timeout: 3
    settle: 1.5
    optional: true
  - text: 以后再说
    timeout: 2
    settle: 1.0
    optional: true
- action: wait
  phase: pre
  target: home_show
  timeout: 25
- action: tap
  phase: pre
  target: home_show
  settle: 6.0
- action: wait
  phase: pre
  target: tab_concert
  timeout: 20
- action: tap
  phase: pre
  target: tab_concert
  settle: 6.0
- action: wait
  phase: pre
  target: search_box
  timeout: 20
- action: search_submit
  phase: pre
  text: 潘玮柏
  settle: 5.0
- action: wait
  phase: pre
  target: result_show
  timeout: 20
- action: tap
  phase: pre
  target: result_show
  settle: 8.0
- action: tap
  phase: pre
  target: city_tab
  settle: 4.0
  optional: true
- action: dismiss
  phase: pre
  rules:
  - text: 我已阅读并同意
    expand:
    - 90
    - 130
    - 60
    - 180
    timeout: 50
    settle: 2.5
    optional: true
  - text: 知道了
    timeout: 15
    settle: 2.5
    optional: true
- action: scroll_top
  phase: pre
  times: 12
  settle: 0.35
- action: wait
  phase: pre
  target: buy_button
  timeout: 25
- action: require
  phase: pre
  target: logged_out_marker
  expect: absent
  message: 设备未登录美团，请先在 App 内手动登录
- action: dump
  phase: pre
  prefix: armed
- action: burst
  phase: fire
  target: buy_button
  until: ticket_ready
  mode: auto
  window: 8.0
  interval_ms: 120
  check_every_ms: 150
  refresh_every: 6
  blockers:
  - 我已阅读并同意
  - 知道了
- action: loop
  phase: post
  until: order_ready
  max_rounds: 3
  budget: 12
  steps:
  - action: select_tier
    priority:
    - ¥380
    - ¥480
    wait: 0.8
    settle: 0.15
    stable_wait: 0.35
    total_budget: 4.0
    optional: true
  - action: select_quantity
    plus_target: qty_plus
    current: 1
    settle: 0.12
    optional: true
  - action: tap
    target: confirm_button
    until: order_ready
    until_timeout: 2.5
    retry: 2
    settle: 0.1
    optional: true
- action: select_attendees
  phase: post
  entry: 需选择
  confirm: 确认选择
  optional: true
- action: tap
  phase: post
  target: pay_button
  until: payment_ready
  until_timeout: 6.0
  settle: 0.1
  requires_submit: true
  optional: true
- action: tap
  phase: post
  target: pay_confirm
  settle: 3.0
  requires_pay: true
  optional: true
- action: stop
  phase: post
  message: 已生成订单并进入支付页，请核对金额与观演人信息后手动支付
stop_before_payment: true
submit_order: false
auto_pay: false
